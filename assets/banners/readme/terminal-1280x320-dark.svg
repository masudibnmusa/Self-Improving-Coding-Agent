<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Self-Improving Coding Agent</title>
<desc id="d">Autonomous GitHub issue resolver: reproduces the bug, fixes it in a Docker sandbox, and proves the fix with tests before opening a PR. Run it with: agent solve followed by an issue URL.</desc>
<defs><style>
/* primitive */
svg {
  --color-white: #FFFFFF;
  --color-slate-50: #F8FAFC;
  --color-slate-100: #F1F5F9;
  --color-slate-200: #E2E8F0;
  --color-slate-300: #CBD5E1;
  --color-slate-400: #94A3B8;
  --color-slate-500: #64748B;
  --color-slate-600: #475569;
  --color-slate-700: #334155;
  --color-slate-800: #1E293B;
  --color-slate-900: #0F172A;
  --color-github-canvas-dark: #0D1117;
  --color-github-surface-dark: #161B22;
  --color-blue-50: #EFF6FF;
  --color-blue-300: #93C5FD;
  --color-blue-400: #60A5FA;
  --color-blue-500: #3B82F6;
  --color-blue-700: #1D4ED8;
  --color-blue-950: #0B1A33;
  --color-amber-50: #FFFBEB;
  --color-amber-300: #FCD34D;
  --color-amber-400: #FBBF24;
  --color-amber-500: #F59E0B;
  --color-amber-700: #B45309;
  --color-amber-950: #2A1B05;
  --color-violet-50: #F5F3FF;
  --color-violet-300: #C4B5FD;
  --color-violet-400: #A78BFA;
  --color-violet-500: #8B5CF6;
  --color-violet-700: #6D28D9;
  --color-violet-950: #1E1438;
  --color-emerald-50: #ECFDF5;
  --color-emerald-300: #6EE7B7;
  --color-emerald-400: #34D399;
  --color-emerald-500: #10B981;
  --color-emerald-700: #047857;
  --color-emerald-950: #062A1F;
  --color-rose-50: #FFF1F2;
  --color-rose-300: #FDA4AF;
  --color-rose-500: #F43F5E;
  --color-rose-700: #BE123C;
  --color-rose-950: #2D0A12;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  --fontSize-2xs: 10px;
  --fontSize-xs: 11px;
  --fontSize-sm: 12px;
  --fontSize-md: 13px;
  --fontSize-lg: 15px;
  --fontSize-xl: 20px;
  --fontSize-2xl: 22px;
  --fontSize-4xl: 46px;
  --fontWeight-regular: 400;
  --fontWeight-semibold: 600;
  --fontWeight-bold: 700;
  --stroke-thin: 1px;
  --stroke-base: 1.5px;
}
/* semantic (dark) */
svg {
  --canvas: var(--color-github-canvas-dark);
  --surface: var(--color-github-surface-dark);
  --fg: var(--color-slate-100);
  --fg-muted: var(--color-slate-400);
  --border: var(--color-slate-700);
  --connector: var(--color-slate-500);
  --neutral-bg: var(--color-github-canvas-dark);
  --neutral-border: var(--color-slate-600);
  --neutral-accent: var(--color-slate-300);
  --host-bg: var(--color-blue-950);
  --host-border: var(--color-blue-400);
  --host-accent: var(--color-blue-300);
  --sandbox-bg: var(--color-amber-950);
  --sandbox-border: var(--color-amber-400);
  --sandbox-accent: var(--color-amber-300);
  --llm-bg: var(--color-violet-950);
  --llm-border: var(--color-violet-400);
  --llm-accent: var(--color-violet-300);
  --output-bg: var(--color-emerald-950);
  --output-border: var(--color-emerald-400);
  --output-accent: var(--color-emerald-300);
  --success: var(--color-emerald-300);
  --success-bg: var(--color-emerald-950);
  --warning: var(--color-amber-300);
  --warning-bg: var(--color-amber-950);
  --danger: var(--color-rose-300);
  --danger-bg: var(--color-rose-950);
}
/* component */
svg {
  --diagram-bg: var(--canvas);
  --title-color: var(--fg);
  --section-color: var(--fg-muted);
  --frame-bg: var(--surface);
  --frame-stroke: var(--border);
  --node-title-color: var(--fg);
  --node-sub-color: var(--fg-muted);
  --connector-stroke: var(--connector);
  --connector-label: var(--fg-muted);
  --chip-bg: var(--canvas);
  --font-ui: var(--font-sans);
  --font-code: var(--font-mono);
  --size-title: var(--fontSize-lg);
  --size-node-title: var(--fontSize-md);
  --size-node-sub: var(--fontSize-xs);
  --size-kicker: var(--fontSize-2xs);
  --size-label: var(--fontSize-xs);
  --size-chip: var(--fontSize-sm);
  --weight-strong: var(--fontWeight-semibold);
  --weight-kicker: var(--fontWeight-bold);
  --stroke-node: var(--stroke-base);
  --stroke-connector: var(--stroke-base);
  --stroke-frame: var(--stroke-thin);
  --banner-bg: var(--canvas);
  --banner-headline: var(--fg);
  --banner-body: var(--fg-muted);
  --banner-rule: var(--border);
  --banner-cta-bg: var(--surface);
  --banner-cta-stroke: var(--border);
  --banner-cta-text: var(--fg);
  --banner-decor: var(--border);
  --size-banner-headline: var(--fontSize-4xl);
  --size-banner-body: var(--fontSize-xl);
  --size-banner-cta: var(--fontSize-lg);
  --size-banner-step: var(--fontSize-xl);
  --size-banner-step-sub: var(--fontSize-lg);
  --size-banner-term: var(--fontSize-lg);
  --weight-banner-headline: var(--fontWeight-bold);
  --size-banner-kicker: var(--fontSize-md);
  --node-neutral-fill: var(--neutral-bg);
  --node-neutral-stroke: var(--neutral-border);
  --node-neutral-kicker: var(--neutral-accent);
  --node-host-fill: var(--host-bg);
  --node-host-stroke: var(--host-border);
  --node-host-kicker: var(--host-accent);
  --node-sandbox-fill: var(--sandbox-bg);
  --node-sandbox-stroke: var(--sandbox-border);
  --node-sandbox-kicker: var(--sandbox-accent);
  --node-llm-fill: var(--llm-bg);
  --node-llm-stroke: var(--llm-border);
  --node-llm-kicker: var(--llm-accent);
  --node-output-fill: var(--output-bg);
  --node-output-stroke: var(--output-border);
  --node-output-kicker: var(--output-accent);
  --status-success-fill: var(--success-bg);
  --status-success-text: var(--success);
  --status-warning-fill: var(--warning-bg);
  --status-warning-text: var(--warning);
  --status-danger-fill: var(--danger-bg);
  --status-danger-text: var(--danger);
}

.bg { fill: var(--banner-bg); }
.kicker { font: var(--weight-kicker) var(--size-banner-kicker) var(--font-ui); letter-spacing: .14em; fill: var(--llm-accent); }
.headline { font: var(--weight-banner-headline) var(--size-banner-headline) var(--font-ui);
            fill: var(--banner-headline); letter-spacing: -.01em; }
.body { font: var(--size-banner-body) var(--font-ui); fill: var(--banner-body); }
.cta-box { fill: var(--banner-cta-bg); stroke: var(--banner-cta-stroke); stroke-width: var(--stroke-frame); }
.cta { font: var(--size-banner-cta) var(--font-code); fill: var(--banner-cta-text); }
.cta-prompt { font: var(--size-banner-cta) var(--font-code); fill: var(--output-accent); }
.rule { stroke: var(--banner-rule); stroke-width: var(--stroke-frame); }
.decor { fill: var(--banner-decor); }
.step-title { font: var(--weight-strong) var(--size-banner-step) var(--font-ui); fill: var(--banner-headline); }
.step-sub { font: var(--size-banner-step-sub) var(--font-code); fill: var(--banner-body); }
.loop-label { font: var(--weight-strong) var(--size-banner-step-sub) var(--font-code); }
.loop-center { font: var(--weight-strong) var(--size-banner-step) var(--font-ui); fill: var(--banner-headline); }
.loop-center-sub { font: var(--size-banner-step-sub) var(--font-ui); fill: var(--banner-body); }
.term { fill: var(--surface); stroke: var(--border); stroke-width: var(--stroke-frame); }
.term-bar { fill: var(--banner-bg); }
.term-text { font: var(--size-banner-term) var(--font-code); fill: var(--banner-headline); }
.term-dim { font: var(--size-banner-term) var(--font-code); fill: var(--banner-body); }
.llm-fill { fill: var(--llm-bg); stroke: var(--llm-border); stroke-width: var(--stroke-node); }
.llm-solid { fill: var(--llm-border); }
.llm-stroke { fill: none; stroke: var(--llm-border); stroke-width: 6; stroke-linecap: round; }
.llm-text { fill: var(--llm-accent); }
.host-fill { fill: var(--host-bg); stroke: var(--host-border); stroke-width: var(--stroke-node); }
.host-solid { fill: var(--host-border); }
.host-stroke { fill: none; stroke: var(--host-border); stroke-width: 6; stroke-linecap: round; }
.host-text { fill: var(--host-accent); }
.sandbox-fill { fill: var(--sandbox-bg); stroke: var(--sandbox-border); stroke-width: var(--stroke-node); }
.sandbox-solid { fill: var(--sandbox-border); }
.sandbox-stroke { fill: none; stroke: var(--sandbox-border); stroke-width: 6; stroke-linecap: round; }
.sandbox-text { fill: var(--sandbox-accent); }
.output-fill { fill: var(--output-bg); stroke: var(--output-border); stroke-width: var(--stroke-node); }
.output-solid { fill: var(--output-border); }
.output-stroke { fill: none; stroke: var(--output-border); stroke-width: 6; stroke-linecap: round; }
.output-text { fill: var(--output-accent); }
</style></defs>
<rect width="1280" height="320" class="bg"/>
<text x="72.0" y="78.0" class="kicker" text-anchor="start">AUTONOMOUS GITHUB ISSUE RESOLVER</text>
<text x="72.0" y="134.0" class="headline" text-anchor="start">Self-Improving Coding Agent</text>
<text x="72.0" y="174.0" class="body" text-anchor="start">Reproduce the bug, fix it in a Docker sandbox,</text>
<text x="72.0" y="202.0" class="body" text-anchor="start">and prove it with tests before opening a PR.</text>
<rect x="72" y="226" width="206" height="46" rx="10" class="cta-box"/>
<text x="90.0" y="255.0" class="cta-prompt" text-anchor="start">$</text>
<text x="110.0" y="255.0" class="cta" text-anchor="start">pip install -e .</text>
<rect x="772" y="40" width="436" height="240" rx="14" class="term"/>
<path d="M773,76 V54 a13,13 0 0 1 13,-13 H1194 a13,13 0 0 1 13,13 V76 Z" class="term-bar"/>
<line x1="772" y1="76" x2="1208" y2="76" class="rule"/>
<circle cx="794" cy="58" r="5.5" class="llm-solid"/>
<circle cx="812" cy="58" r="5.5" class="sandbox-solid"/>
<circle cx="830" cy="58" r="5.5" class="output-solid"/>
<text x="990.0" y="63.0" class="term-dim" text-anchor="middle">agent solve · example run</text>
<text x="794.0" y="110.0" class="term-text" text-anchor="start">$ agent solve …/acme/app/issues/42</text>
<circle cx="800" cy="133" r="4.5" class="llm-solid"/>
<text x="816.0" y="138.0" class="term-text llm-text" text-anchor="start">plan</text>
<text x="889.6" y="138.0" class="term-dim" text-anchor="start">locate parse_date()</text>
<circle cx="800" cy="161" r="4.5" class="sandbox-solid"/>
<text x="816.0" y="166.0" class="term-text sandbox-text" text-anchor="start">repro</text>
<text x="889.6" y="166.0" class="term-dim" text-anchor="start">1 failed</text>
<circle cx="800" cy="189" r="4.5" class="host-solid"/>
<text x="816.0" y="194.0" class="term-text host-text" text-anchor="start">edit</text>
<text x="889.6" y="194.0" class="term-dim" text-anchor="start">app/dates.py (+3 −1)</text>
<circle cx="800" cy="217" r="4.5" class="sandbox-solid"/>
<text x="816.0" y="222.0" class="term-text sandbox-text" text-anchor="start">test</text>
<text x="889.6" y="222.0" class="term-dim" text-anchor="start">no new failures</text>
<circle cx="800" cy="245" r="4.5" class="output-solid"/>
<text x="816.0" y="250.0" class="term-text output-text" text-anchor="start">status</text>
<text x="889.6" y="250.0" class="term-dim" text-anchor="start">resolved · PR opened</text>
</svg>
